name: DeepCuts
options:
  bundleIdPrefix: com.jackwallner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "7"
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

schemes:
  DeepCuts:
    build:
      targets:
        DeepCuts: all
        DeepCutsTests: [test]
        DeepCutsUITests: [test]
    test:
      config: Debug
      targets:
        - DeepCutsTests
        - DeepCutsUITests
    run:
      config: Debug

targets:
  DeepCuts:
    type: application
    platform: iOS
    sources:
      - path: DeepCuts
        excludes:
          - Content/**
      - path: DeepCuts/Content
        type: folder
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.deepcuts
        INFOPLIST_FILE: DeepCuts/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  DeepCutsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/DeepCutsTests
    dependencies:
      - target: DeepCuts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.deepcuts.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DeepCuts.app/DeepCuts"
        BUNDLE_LOADER: "$(TEST_HOST)"

  DeepCutsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DeepCutsUITests
    dependencies:
      - target: DeepCuts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.deepcuts.uitests
        TEST_TARGET_NAME: DeepCuts
